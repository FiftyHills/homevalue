<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Value Request</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f2f0;
  --surface:#ffffff;
  --ink:#111111;
  --muted:#6b6b6b;
  --accent:#111111;
  --accent-ink:#ffffff;
  --line:#dcdcd9;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121212;
    --surface:#1b1b1b;
    --ink:#f5f5f5;
    --muted:#a0a0a0;
    --accent:#f5f5f5;
    --accent-ink:#111111;
    --line:#2e2e2e;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 16px;
}
.page{width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px}

.agent-strip{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
}
.agent-avatar{
  width:44px;height:44px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:600;font-size:17px;
  flex-shrink:0;
}
.agent-meta{min-width:0}
.agent-name{font-weight:600;font-size:14px;line-height:1.3}
.agent-role{color:var(--muted);font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:32px 28px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(24px,6vw,30px);
  line-height:1.15;
  margin:0;
}
.address-line{
  font-size:14.5px;
  color:var(--muted);
  margin:0;
  padding-top:2px;
}
.address-line strong{color:var(--ink);font-weight:600}

form{display:flex;flex-direction:column;gap:12px;margin-top:6px}
label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px}
input[type="text"],input[type="tel"]{
  font-family:var(--font-body);
  font-size:16px;
  padding:13px 14px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--ink);
  width:100%;
}
input::placeholder{color:var(--muted);opacity:.75}
input:focus{outline:2px solid var(--accent);outline-offset:1px}

button{
  font-family:var(--font-body);
  font-size:16px;
  font-weight:600;
  padding:14px 16px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  color:var(--accent-ink);
  cursor:pointer;
  margin-top:4px;
}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:default}

.thanks{display:none;flex-direction:column;gap:10px;text-align:center;padding:8px 0}
.thanks.show{display:flex}
.thanks h2{font-family:var(--font-display);font-size:22px;margin:0}
.thanks p{color:var(--muted);font-size:14.5px;margin:0;line-height:1.5}
.direct-contact{
  margin-top:6px;padding:12px 14px;border-radius:10px;
  background:var(--bg);border:1px solid var(--line);
  font-size:14px;
}
.direct-contact strong{display:block;color:var(--ink);margin-bottom:2px}

form[hidden]{display:none!important}
</style>
</head>
<body>

<div class="page">
  <div class="agent-strip" id="agentStrip">
    <div class="agent-avatar" id="agentInitial">?</div>
    <div class="agent-meta">
      <div class="agent-name" id="agentName">Your local agent</div>
      <div class="agent-role" id="agentContact">Reach out with a few details and I'll call you</div>
    </div>
  </div>

  <div class="card">
    <h1 id="headline">What could your home sell for right now?</h1>
    <p class="address-line" id="addressLine" hidden>We just sold <strong id="addressText"></strong> in your neighborhood</p>

    <form id="leadForm">
      <div class="field">
        <label for="sellerAddress">Address you're thinking about selling</label>
        <input type="text" id="sellerAddress" name="sellerAddress" placeholder="123 Main St" required>
      </div>
      <div class="field">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" name="firstName" placeholder="First name" required>
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" inputmode="tel" placeholder="(555) 123-4567" required>
      </div>
      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <div class="thanks" id="thanks">
      <h2>Sent.</h2>
      <p id="thanksBody">You'll hear back shortly.</p>
      <div class="direct-contact" id="directContact" hidden>
        <strong id="directName"></strong>
        <span id="directDetail"></span>
      </div>
    </div>
  </div>
</div>

function params(){
  return new URLSearchParams(window.location.search);
}

function initials(name){
  return name.split(" ").map(function(p){ return p[0] || ""; }).join("").slice(0,2).toUpperCase();
}

function boot(){
  var p = params();
  var code = p.get("a") || "";
  var mailedAddress = p.get("addr") || "";
  var agent = AGENTS[code];

  if (agent){
    document.getElementById("agentName").textContent = agent.name;
    document.getElementById("agentContact").textContent = agent.phone + " · " + agent.email;
    document.getElementById("agentInitial").textContent = initials(agent.name);
  }

  if (mailedAddress){
    document.getElementById("addressLine").hidden = false;
    document.getElementById("addressText").textContent = mailedAddress;
  }

  var form = document.getElementById("leadForm");
  var btn = document.getElementById("submitBtn");

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    btn.disabled = true;
    btn.textContent = "Sending…";

    var body = new URLSearchParams();
    body.set("sellerAddress", document.getElementById("sellerAddress").value.trim());
    body.set("firstName", document.getElementById("firstName").value.trim());
    body.set("lastName", document.getElementById("lastName").value.trim());
    body.set("phone", document.getElementById("phone").value.trim());
    body.set("agentCode", code);
    body.set("agentName", agent ? agent.name : "");
    body.set("mailedAddress", mailedAddress);
    body.set("source", "postcard");
    body.set("submittedAt", new Date().toISOString());

    var finish = function(){
      form.hidden = true;
      var thanks = document.getElementById("thanks");
      thanks.classList.add("show");
      if (agent){
        document.getElementById("thanksBody").textContent = agent.name + " will reach out shortly.";
        document.getElementById("directContact").hidden = false;
        document.getElementById("directName").textContent = agent.name;
        document.getElementById("directDetail").textContent = "Prefer to talk now? " + agent.phone;
      }
    };

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    }).then(finish).catch(finish);
  });
}

if (document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
